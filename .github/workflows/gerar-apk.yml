
name: Gerar APK Android.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Localizar e extrair o projeto
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '* (4).zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Arquivo ZIP corrigido nao encontrado."
            exit 1
          fi
          mkdir projeto
          unzip -o "$ZIP_FILE" -d projeto

      - name: Preparar projeto Android
        working-directory: projeto/meu_caderno_social_flutter
        run: |
          flutter create --platforms=android --project-name meu_caderno_social .
          sed -i 's/flutter_local_notifications: \^17\.3\.0/flutter_local_notifications: ^18.0.1/' pubspec.yaml

      - name: Corrigir tema dos cartões
        working-directory: projeto/meu_caderno_social_flutter
        run: |
          sed -i 's/CardTheme(/CardThemeData(/g' lib/main.dart
          grep -n "cardTheme:" lib/main.dart
      - name: Instalar dependencias
        working-directory: projeto/meu_caderno_social_flutter
        run: flutter pub get

      - name: Gerar APK
        working-directory: projeto/meu_caderno_social_flutter
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Caderno-Social
          path: projeto/meu_caderno_social_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
